[project]
name = "painel-escolas-fastapi"
version = "0.1.0"
description = "Painel de escolas (demo de portfólio): parque tecnológico e conectividade, com dados fictícios"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]
